log_format render_request '$remote_addr [$time_local] request_id=$request_id "$request_method $request_uri" '
    'status=$status upstream_status=$upstream_status '
    'upstream_addr=$upstream_addr upstream_header_time=$upstream_header_time '
    'upstream_response_length=$upstream_response_length '
    'request_time=$request_time upstream_time=$upstream_response_time';
